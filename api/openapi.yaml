openapi: 3.0.0
info:
  title: Follow My Journey - Profile Service
  version: 0.1.0
paths:
  /profiles/{id}:
    get:
      summary: Get profile by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /profiles:
    post:
      summary: Create profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '201':
          description: Created
components:
  schemas:
    Profile:
      type: object
      properties:
        guid:
          type: string
        email:
          type: string
        screen_name:
          type: string
